<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6CF68">
<title>ちょい計算パンダ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF9;
    --surface:#FFFFFF;
    --text:#6B5646;
    --muted:#9C8874;
    --rose:#F6CF68;
    --rose-dark:#DDAE3F;
    --divider:#EFE4D5;
    --card-border: 1px solid var(--divider);
    --danger-text:#B8747C;
    --mint:#7FC4B8;
    --current-feature-color: var(--rose);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Kosugi Maru','Hiragino Sans',sans-serif;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    margin:14px 18px 6px;
    position:sticky;
    top:14px;
    background:var(--surface);
    border-radius:18px;
    border:var(--card-border);
    z-index:5;
  }
  header.topbar h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    flex:1;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .title-icon{
    width:26px; height:26px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--mint);
  }
  .title-icon svg{
    width:100%; height:100%;
  }
  .iconbtn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--text);
    flex-shrink:0;
  }
  .iconbtn svg{width:19px; height:19px;}
  .iconbtn.back-btn svg{width:23px; height:23px;}
  main{ flex:1; padding:4px 18px 120px; }

  /* ---- Home: menu list ---- */
  .menu-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border-radius:18px;
    padding:16px 16px;
    margin-bottom:12px;
    border:var(--card-border);
    cursor:pointer;
  }
  .dot{
    width:16px; height:16px;
    border-radius:50%;
    flex-shrink:0;
  }
  .menu-card .name{
    flex:1;
    font-weight:700;
    font-size:17px;
    font-family:'Zen Maru Gothic', sans-serif;
  }
  .menu-card .arrow{
    color:var(--muted);
    flex-shrink:0;
    display:flex;
  }
  .menu-card .arrow svg{ width:18px; height:18px; }

  .home-hero-fixed{
    position:fixed;
    left:50%;
    bottom:42px;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    pointer-events:none;
    z-index:4;
  }
  .home-hero-fixed img{
    width:118px;
    height:118px;
    object-fit:contain;
    display:block;
    margin:0 auto 4px;
  }

  /* ---- 計算画面 共通 ---- */
  .calc-field{
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    border:var(--card-border);
  }
  .calc-field label{
    display:block;
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .calc-field .field-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .calc-field input[type=number], .calc-field select{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:20px;
    font-weight:700;
    color:var(--text);
    width:100%;
    padding:4px 0;
    -moz-appearance:textfield;
  }
  .calc-field input::-webkit-outer-spin-button,
  .calc-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .calc-field .unit{
    font-size:16px;
    font-weight:500;
    color:var(--muted);
    flex-shrink:0;
  }
  .calc-field select{
    font-size:16px;
    -webkit-appearance:none;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239C8874' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
    background-repeat:no-repeat;
    background-position:right 2px center;
    background-size:16px;
    padding-left:4px;
    padding-right:22px;
  }
  .calc-field select.unit-select{
    padding-left:4px;
  }
  .segment{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .segment button{
    flex:1;
    min-width:calc(50% - 4px);
    padding:11px 8px;
    border-radius:12px;
    border:1px solid var(--divider);
    background:var(--surface);
    color:var(--muted);
    font-family:'Kosugi Maru',sans-serif;
    font-size:13px;
    line-height:1.3;
    cursor:pointer;
  }
  .segment button.active{
    background:var(--rose);
    border-color:var(--rose);
    color:var(--text);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
  }
  .section-label{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    margin:20px 0 10px 2px;
  }
  .section-label:first-child{ margin-top:4px; }
  .calc-btn{
    width:100%;
    padding:15px;
    border-radius:16px;
    background:var(--current-feature-color, var(--rose));
    color:#FFFFFF;
    border:none;
    font-size:16px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
    margin-top:6px;
  }
  .clear-link{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-top:12px;
    cursor:pointer;
  }

  /* ---- 結果カード ---- */
  .result-card{
    background:var(--surface);
    border-radius:20px;
    padding:22px 20px;
    margin-top:22px;
    border:var(--card-border);
    text-align:center;
  }
  .result-card img{
    width:56px; height:56px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
  }
  .result-card .result-label{
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .result-card .result-number{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:34px;
    color:var(--text);
    margin-bottom:2px;
  }
  .result-card .result-number .small{
    font-size:16px;
    font-weight:500;
    margin-left:2px;
  }
  .result-card .result-sub{
    font-size:13.5px;
    color:var(--muted);
    margin-top:6px;
    line-height:1.6;
  }
  .result-card .result-winner{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--text);
    margin-bottom:10px;
  }
  .compare-lines{
    text-align:left;
    background:var(--bg);
    border-radius:12px;
    padding:12px 14px;
    margin-top:12px;
    font-size:14px;
    line-height:1.9;
  }
  .compare-lines .win{ font-weight:700; color:var(--rose-dark); }

  .error-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid #E9C9C7;
    border-radius:14px;
    padding:12px 14px;
    margin-top:14px;
    font-size:13.5px;
    color:var(--danger-text);
    line-height:1.5;
  }
  .error-box img{ width:36px; height:36px; object-fit:contain; flex-shrink:0; }

  /* ---- History ---- */
  .history-section-label{
    font-size:13px;
    color:var(--muted);
    margin:18px 4px 8px;
  }
  .history-item{
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:8px;
    border:var(--card-border);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .history-item .dot{ width:12px; height:12px; }
  .history-item .hbody{ flex:1; }
  .history-item .htitle{ font-size:14px; font-weight:700; }
  .history-item .hsub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .history-item .harrow{ color:var(--muted); flex-shrink:0; display:flex; }
  .history-item .harrow svg{ width:16px; height:16px; }

  .empty-hint{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:40px;
    line-height:1.8;
  }
  .empty-hint img{ display:block; width:110px; height:auto; margin:0 auto 8px; }

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(58,53,50,0.35);
    display:flex; align-items:flex-end;
    z-index:20;
  }
  .modal-backdrop.hidden{ display:none; }
  .modal-sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:22px 22px 0 0;
    padding:22px 20px 28px;
    max-height:82vh;
    overflow-y:auto;
  }
  .modal-sheet h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:17px;
    margin:0 0 16px;
  }
  .help-content{
    font-size:14.5px;
    line-height:1.7;
    color:var(--text);
  }
  .help-content p{ margin:0 0 14px; }
  .help-content h3{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:16px;
    margin:22px 0 10px;
    padding-top:16px;
    border-top:1px solid var(--divider);
  }
  .help-content .help-note{ font-size:13px; color:var(--muted); }
  .about-panda{
    display:block;
    width:64px; height:64px;
    object-fit:contain;
    margin:0 auto 14px;
  }
  .modal-actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--muted);
    font-size:14px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
  }
  .btn:hover, .btn:active{
    background:var(--rose);
    border-color:var(--rose);
  }

  .settings-menu{ display:flex; flex-direction:column; }
  .settings-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:transparent;
    border:none;
    text-align:left;
    padding:14px 4px;
    font-size:15px;
    font-family:'Kosugi Maru',sans-serif;
    color:var(--text);
    cursor:pointer;
    width:100%;
  }
  .settings-item .settings-icon{
    font-size:17px; width:22px; flex-shrink:0; text-align:center;
  }
  .settings-divider{ height:1px; background:var(--divider); margin:4px 0; border:none; }

  /* ---- 並び替え ---- */
  .reorder-hint{
    font-size:13px;
    color:var(--muted);
    margin-bottom:14px;
    line-height:1.6;
  }
  .reorder-list{ margin-bottom:18px; }
  .reorder-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bg);
    border:1px solid var(--divider);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .reorder-row .dot{ width:13px; height:13px; }
  .reorder-row .name{ flex:1; font-size:14.5px; }
  .reorder-btns{ display:flex; gap:4px; }
  .reorder-btns button{
    width:30px; height:30px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .reorder-btns button:disabled{ opacity:0.3; cursor:default; }
  .reorder-btns svg{ width:14px; height:14px; }

  .reorder-row .dot{ cursor:pointer; }
  .color-palette{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    padding:10px 4px 2px;
    margin:-4px 0 8px;
    background:var(--bg);
    border-radius:0 0 14px 14px;
  }
  .color-palette.open{ display:flex; }
  .color-swatch{
    width:24px; height:24px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
  }
  .color-swatch.selected{
    border-color:var(--text);
  }
  .color-swatch.used{
    opacity:0.3;
    cursor:default;
  }
  .help-reset-btn-wrap{
    margin:10px 0 4px;
  }
  .help-reset-btn-wrap .btn{
    width:100%;
    padding:11px;
    font-size:13.5px;
  }
  .color-row{
    display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;
  }
  #tkColorRow.color-row .color-swatch{
    width:28px; height:28px;
  }

  /* ---- たいきんパンダ：リストUI ---- */
  .tk-add-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border-radius:16px;
    padding:6px 8px 6px 16px;
    border:var(--card-border);
    margin-bottom:16px;
  }
  .tk-add-row input{
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
    padding:10px 0;
    background:transparent;
    font-family:'Kosugi Maru',sans-serif;
    color:var(--text);
  }
  .tk-add-row input::placeholder{ color:var(--muted); }
  .tk-add-row button{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:var(--current-feature-color, #D4537E);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .tk-add-row button svg{ width:18px; height:18px; }
  .tk-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:16px;
    padding:13px 14px;
    margin-bottom:8px;
    border:var(--card-border);
    touch-action:pan-y;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .tk-item.dragging{
    position:absolute;
    left:0; right:0;
    z-index:10;
    box-shadow:0 8px 20px rgba(59,48,38,0.18);
    opacity:0.97;
    touch-action:none;
  }
  #tkList.reordering{ position:relative; }
  #tkList.reordering .tk-item:not(.dragging){ transition:transform 0.18s ease; }
  body.dragging-active{ -webkit-user-select:none; user-select:none; }
  .tk-item.checked{ opacity:0.55; }
  .tk-item.checked .tk-text{ text-decoration:line-through; color:var(--muted); }
  .tk-checkbox{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid var(--divider);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background:var(--bg);
  }
  .tk-checkbox.on{
    background:var(--current-feature-color, #D4537E);
    border-color:var(--current-feature-color, #D4537E);
  }
  .tk-checkbox svg{ width:13px; height:13px; opacity:0; }
  .tk-checkbox.on svg{ opacity:1; }
  .tk-text{
    flex:1;
    font-size:14.5px;
    line-height:1.5;
    word-break:break-word;
  }
  .tk-remove{
    border:none; background:none;
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:4px;
  }
  .tk-remove svg{ width:16px; height:16px; }
  .tk-edit{
    border:none; background:none;
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:4px;
  }
  .tk-edit svg{ width:15px; height:15px; }
  .tk-progress{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--muted);
    margin:2px 2px 12px;
  }
  .tk-taikin-btn{
    width:100%;
    padding:16px;
    border-radius:18px;
    background:var(--rose);
    color:var(--text);
    border:none;
    font-size:15px;
    font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tk-taikin-btn .tk-btn-text{
    position:relative;
  }
  .tk-taikin-btn .tk-btn-panda{
    position:absolute;
    right:100%;
    top:50%;
    transform:translateY(-50%);
    margin-right:8px;
  }
  .tk-btn-panda{ width:40px; height:40px; object-fit:contain; flex-shrink:0; }
  .tk-add-list-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:16px;
    border-radius:18px;
    border:var(--card-border);
    background:transparent;
    color:var(--muted);
    font-size:14px;
    font-family:'Zen Maru Gothic', sans-serif;
    cursor:pointer;
    margin-top:4px;
  }
  .tk-add-list-btn svg{ width:16px; height:16px; }
  .tk-mini-progress{
    font-size:15px;
    color:var(--muted);
    flex-shrink:0;
  }
  .tk-list-edit{
    border:none;
    background:none;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:4px;
    flex-shrink:0;
  }
  .tk-list-edit svg{ width:15px; height:15px; }
  .tk-reset-choice{
    padding:10px;
    border-radius:12px;
    border:1px solid var(--divider);
    background:var(--bg);
    font-size:13.5px;
    font-family:'Kosugi Maru',sans-serif;
    color:var(--text);
    cursor:pointer;
  }
  .tk-reset-choice.selected{
    border-color:var(--rose);
    background:var(--rose);
    font-weight:700;
  }
  .tk-history-toggle{ cursor:pointer; }
  .tk-taikin-sub{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }
  .tk-history-item{
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:8px;
    border:var(--card-border);
  }
  .tk-history-item .tk-hdate{
    font-weight:700;
    font-size:14px;
    font-family:'Zen Maru Gothic', sans-serif;
    margin-bottom:4px;
  }
  .tk-history-item .tk-hsub{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.7;
  }
  .tk-history-item .tk-hsub svg{
    width:13px;
    height:13px;
    vertical-align:-2px;
  }
  .tk-toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%) translateY(10px);
    background:#33302C;
    color:#fff;
    padding:11px 20px;
    border-radius:20px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    white-space:nowrap;
    z-index:30;
  }
  .tk-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>

  <div class="home-hero-fixed" id="homeHeroFixed" style="display:none;">
    <div id="heroTap" style="cursor:pointer; display:inline-block; pointer-events:auto;"></div>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

  <div class="tk-toast" id="tkToast"></div>
</div>

<script>
/* ====================== 機能定義 ====================== */
const FEATURES = [
  { id:"toilet",   name:"トイレットペーパー単価", color:"#BFD6E8" },
  { id:"discount", name:"割引計算",               color:"#F0C9B0" },
  { id:"compare",  name:"どっちがお得？",         color:"#E6B8BE" },
  { id:"mentsuyu", name:"めんつゆ濃縮倍率",       color:"#C7B299" }
];
function featureById(id){ return FEATURES.find(f => f.id === id); }

const COLOR_PALETTE = [

/* ====================== データ管理 ====================== */
const ORDER_KEY = "tankaPandaOrder";
const HISTORY_KEY = "tankaPandaHistory";
const COLORS_KEY = "tankaPandaColors";
const MAX_HISTORY_PER_FEATURE = 5;

const OLD_COLOR_MIGRATION = {
  "#A9D8C9": "#AEDFD1", // 旧ミント → 新ミント
  "#F2D98A": "#F6CF68", // 旧イエロー → 新ハニー
  "#C9BCE0": "#CDBFDD", // 旧パープル → 新ラベンダー
  "#B8C9A8": "#A8BFA5"  // 旧グリーン → 新セージ
};
function loadColors(){
  let c = null;
  try{
    const raw = localStorage.getItem(COLORS_KEY);
    if(raw) c = JSON.parse(raw);
  }catch(e){}
  if(!c || typeof c !== "object") c = {};
  let migrated = false;
  Object.keys(c).forEach(id => {
    const old = c[id];
    if(OLD_COLOR_MIGRATION[old]){
      c[id] = OLD_COLOR_MIGRATION[old];
      migrated = true;
    }
  });
  if(migrated){
    try{ localStorage.setItem(COLORS_KEY, JSON.stringify(c)); }catch(e){}
  }
  return c;
}
function saveColors(){ localStorage.setItem(COLORS_KEY, JSON.stringify(state.colors)); }

function loadOrder(){
  let order = null;
  try{
    const raw = localStorage.getItem(ORDER_KEY);
    if(raw) order = JSON.parse(raw);
  }catch(e){}
  if(!Array.isArray(order) || order.length !== FEATURES.length){
    order = FEATURES.map(f => f.id);
  }
  return order;
}
function saveOrder(order){ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }

function loadHistory(){
  let h = null;
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(raw) h = JSON.parse(raw);
  }catch(e){}
  if(!h) h = {};
  FEATURES.forEach(f => { if(!Array.isArray(h[f.id])) h[f.id] = []; });
  return h;
}
function saveHistory(){ localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history)); }
function pushHistory(featureId, label, sub){
  const entry = { label, sub, ts: Date.now() };
  state.history[featureId].unshift(entry);
  state.history[featureId] = state.history[featureId].slice(0, MAX_HISTORY_PER_FEATURE);
  saveHistory();
}

const TK_DONE_GRACE_MS = 6 * 60 * 60 * 1000; // チェック後、履歴に移るまでの猶予（6時間）

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function tkGenId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }

function defaultTaikinData(){
  return {

      { id:"tk_daily", name:"毎日のタスク", color:"#AEDFD1", reset:"daily" },
      { id:"tk_today", name:"今日だけのタスク", color:"#F0C9B0", reset:"daily" },
      { id:"tk_stock", name:"備品リスト", color:"#CDBFDD", reset:"none" }
    ],

  };
}
function loadTaikinData(){
  let d = null;
  try{
    const raw = localStorage.getItem(TAIKIN_KEY);
    if(raw) d = JSON.parse(raw);
  }catch(e){}
  if(!d) d = defaultTaikinData();

    d.lists = [

    ];
    d.items = {
      tk_daily: Array.isArray(d.dailyItems) ? d.dailyItems : [],
      tk_today: Array.isArray(d.todayItems) ? d.todayItems : [],
      tk_stock: Array.isArray(d.stockItems) ? d.stockItems.map(i => ({ id:i.id, text:i.text, checked:false, doneAt:null })) : []
    };
  }
  if(!d.items) d.items = {};
  d.lists.forEach(l => { if(!Array.isArray(d.items[l.id])) d.items[l.id] = []; });
  if(!Array.isArray(d.dayLog)) d.dayLog = [];
  if(!Array.isArray(d.completedHistory)) d.completedHistory = [];
  return d;
}
function saveTaikinData(){ localStorage.setItem(TAIKIN_KEY, JSON.stringify(state.taikin)); }

// 「リセットなし」リストで、チェック後6時間経った項目を完了履歴へ移す
function tkMigrateCompleted(){
  let changed = false;
  const now = Date.now();
  state.taikin.lists.forEach(list => {
    if(list.reset !== "none") return;
    const items = state.taikin.items[list.id] || [];
    const stillActive = [];
    items.forEach(item => {
      if(item.checked){
        const doneTime = item.doneAt ? new Date(item.doneAt).getTime() : now;
        const elapsed = now - doneTime;
        if(!isNaN(doneTime) && elapsed >= TK_DONE_GRACE_MS){
          state.taikin.completedHistory.unshift({
            id: tkGenId(), text: item.text, listName: list.name,
            date: item.doneAt ? item.doneAt.slice(0,10) : todayStr()
          });
          changed = true;
        }else{
          stillActive.push(item);
        }
      }else{
        stillActive.push(item);
      }
    });
    state.taikin.items[list.id] = stillActive;
  });
  if(changed){
    state.taikin.completedHistory = state.taikin.completedHistory.slice(0, MAX_STOCK_HISTORY);
    saveTaikinData();
  }
  return changed;
}

// 「毎日リセット」リストを記録に残しつつチェックを外す
function tkDailyReset(manual){
  const t = state.taikin;
  const dailyLists = t.lists.filter(l => l.reset === "daily");
  const logLists = [];
  dailyLists.forEach(l => {
    const items = t.items[l.id] || [];
    if(items.length === 0) return;
    const done = items.filter(i => i.checked).length;
    logLists.push({
      listId: l.id, name: l.name, done, total: items.length,
      items: items.map(i => ({ text:i.text, checked:i.checked }))
    });
  });
  const dateForLog = manual ? todayStr() : t.lastDate;
  if(logLists.length > 0){
    t.dayLog = t.dayLog.filter(e => e.date !== dateForLog);
    t.dayLog.unshift({ date: dateForLog, lists: logLists });
    t.dayLog = t.dayLog.slice(0, MAX_DAYLOG);
  }
  dailyLists.forEach(l => {
    t.items[l.id] = (t.items[l.id] || []).map(i => ({ ...i, checked:false, doneAt:null }));
  });
  t.lastDate = todayStr();
  saveTaikinData();
}
function tkCheckAutoReset(){
  tkMigrateCompleted();
  if(state.taikin.lastDate !== todayStr()){
    tkDailyReset(false);
  }
}

function tkToast(msg){
  const el = document.getElementById("tkToast");

  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(tkToast._t);
  tkToast._t = setTimeout(()=>el.classList.remove("show"), 1600);
}

function fmt(n, maxDigits){
  if(maxDigits === undefined) maxDigits = 1;
  if(!isFinite(n)) return "-";
  const v = Math.round(n * Math.pow(10, maxDigits)) / Math.pow(10, maxDigits);
  if(Number.isInteger(v)){
    return v.toLocaleString("ja-JP");
  }
  return v.toLocaleString("ja-JP", { minimumFractionDigits: maxDigits, maximumFractionDigits: maxDigits });
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

      renderFeature(f.id);

  let all = [];
  FEATURES.forEach(f => {
    state.history[f.id].forEach(h => all.push({ feature:f, ...h }));
  });
  all.sort((a,b) => b.ts - a.ts);

  if(all.length === 0){
    mainEl.innerHTML = `
      <div class="empty-hint">
        ${pandaImg("panda13")}
        まだ計算履歴はないよ。<br>計算するとここに残るよ♪

  }

  mainEl.innerHTML = `

    <div id="historyList"></div>

}

  const dailyLists = state.taikin.lists.filter(l => l.reset === "daily");
  const uncheckedCount = dailyLists.reduce((sum, l) => sum + (state.taikin.items[l.id] || []).filter(i => !i.checked).length, 0);

    openTkConfirmResetModal(uncheckedCount);
  }else{
    tkDailyReset(true);
    render();
    tkToast("お疲れさま！また明日🐼");
  }
}

    });

    document.getElementById("tkListDeleteBtn").onclick = () => {
      const targetList = state.taikin.lists.find(x => x.id === tkEditingListId);
      if(!confirm(`「${targetList.name}」を削除しますか?中の項目もすべて消えます。`)) return;
      state.taikin.lists = state.taikin.lists.filter(x => x.id !== tkEditingListId);
      delete state.taikin.items[tkEditingListId];
      saveTaikinData();

function renderTkList(listId){
  const list = state.taikin.lists.find(l => l.id === listId);
  if(!list){ goHome(); return; }
  const items = state.taikin.items[listId] || [];
  const total = items.length;
  const done = items.filter(i => i.checked).length;

  mainEl.innerHTML = `
    <div class="tk-add-row">

      <button id="tkAddBtn">${ICONS.plus}</button>
    </div>
    <div class="tk-progress"><span>${total===0?'':`${done}/${total} 完了`}</span></div>
    <div id="tkList"></div>
  `;

  function updateProgress(){
    const arr = state.taikin.items[listId] || [];
    const d2 = arr.filter(i => i.checked).length;
    mainEl.querySelector(".tk-progress span").textContent = arr.length===0 ? '' : `${d2}/${arr.length} 完了`;
  }

  function draw(){
    const arr = state.taikin.items[listId] || [];
    const listEl = document.getElementById("tkList");
    if(arr.length === 0){
      listEl.innerHTML = `<div class="empty-hint" style="margin-top:16px;">まだ項目がないよ。上の欄から追加してね。</div>`;
      return;
    }
    listEl.innerHTML = arr.map(item => `
      <div class="tk-item ${item.checked?'checked':''}" data-id="${item.id}">
        <div class="tk-checkbox ${item.checked?'on':''}" data-act="toggle">${tkCheckSvg()}</div>
        <span class="tk-text">${escapeHtml(item.text)}</span>
        <button class="tk-edit" data-act="edit">${ICONS.edit}</button>
        <button class="tk-remove" data-act="remove">${ICONS.trash}</button>
      </div>
    `).join("");
    listEl.querySelectorAll(".tk-item").forEach(row => {
      const id = row.dataset.id;
      row.querySelector('[data-act="toggle"]').addEventListener("click", () => {
        const item = state.taikin.items[listId].find(i => i.id === id);
        item.checked = !item.checked;
        item.doneAt = item.checked ? nowISO() : null;
        saveTaikinData();
        updateProgress();
        draw();
      });
      row.querySelector('[data-act="edit"]').addEventListener("click", () => {
        openTkItemEditModal(listId, id, draw, updateProgress);
      });
      row.querySelector('[data-act="remove"]').addEventListener("click", () => {
        state.taikin.items[listId] = state.taikin.items[listId].filter(i => i.id !== id);
        saveTaikinData();
        updateProgress();
        draw();
      });
    });
    attachTkItemReorderHandlers(listEl, listId, draw, updateProgress);
  }
  draw();

  document.getElementById("tkAddBtn").onclick = addTk;
  document.getElementById("tkInput").addEventListener("keydown", e => { if(e.key==="Enter") addTk(); });
  function addTk(){
    const input = document.getElementById("tkInput");
    const v = input.value.trim();
    if(!v) return;
    state.taikin.items[listId].push({ id: tkGenId(), text:v, checked:false, doneAt:null });
    input.value = "";
    saveTaikinData();
    updateProgress();
    draw();
  }
}

/* ---- やることパンダ：タスクの長押し並び替え ---- */
function attachTkItemReorderHandlers(container, listId, draw, updateProgress){
  const arr = state.taikin.items[listId] || [];
  if(arr.length < 2) return;

  container.querySelectorAll(".tk-item").forEach(row => {
    let pressTimer = null;
    let startX = 0, startY = 0;
    let longPressFired = false;

    const cancelPress = () => {
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    };

    row.addEventListener("pointerdown", (e) => {
      if(e.target.closest(".tk-checkbox") || e.target.closest(".tk-edit") || e.target.closest(".tk-remove")) return;
      if(e.pointerType === "mouse" && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        startTkItemDrag(row, e, container, listId, draw, updateProgress);
      }, 450);
    });

    row.addEventListener("pointermove", (e) => {
      if(pressTimer){
        if(Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) cancelPress();
      }
    });

    row.addEventListener("pointerup", cancelPress);
    row.addEventListener("pointercancel", cancelPress);
  });
}

function startTkItemDrag(card, startEvent, container, listId, draw, updateProgress){
  if(navigator.vibrate) navigator.vibrate(12);

  const rows = Array.from(container.querySelectorAll(".tk-item"));
  const draggedId = card.dataset.id;
  const containerRect = container.getBoundingClientRect();

  const originalRects = rows.map(el => {
    const r = el.getBoundingClientRect();
    return { id: el.dataset.id, top: r.top - containerRect.top, height: r.height };
  });
  const draggedIndex = originalRects.findIndex(r => r.id === draggedId);
  const slotHeight = originalRects.length > 1
    ? (originalRects[1].top - originalRects[0].top)
    : (originalRects[0].height + 8);
  const cardRect = card.getBoundingClientRect();
  const offsetWithinCard = startEvent.clientY - cardRect.top;

  const otherIdsInOrder = originalRects.filter(r => r.id !== draggedId).map(r => r.id);
  let currentTargetIndex = draggedIndex;

  container.classList.add("reordering");
  document.body.classList.add("dragging-active");
  card.classList.add("dragging");
  card.style.top = originalRects[draggedIndex].top + "px";
  card.style.height = originalRects[draggedIndex].height + "px";
  try{ card.setPointerCapture(startEvent.pointerId); }catch(e){}

  function applyOtherRowTransforms(targetIndex){
    const newOrder = otherIdsInOrder.slice(0, targetIndex)
      .concat([draggedId])
      .concat(otherIdsInOrder.slice(targetIndex));

    rows.forEach(el => {
      if(el === card) return;
      const orig = originalRects.find(r => r.id === el.dataset.id);
      const newIdx = newOrder.indexOf(el.dataset.id);
      const newTop = newIdx * slotHeight + originalRects[0].top;
      el.style.transform = `translateY(${newTop - orig.top}px)`;
    });
  }

  function onMove(e){
    const containerRectNow = container.getBoundingClientRect();
    const maxTop = originalRects[originalRects.length-1].top + originalRects[originalRects.length-1].height - originalRects[draggedIndex].height;
    let top = (e.clientY - containerRectNow.top) - offsetWithinCard;
    top = Math.max(0, Math.min(top, Math.max(0, maxTop)));
    card.style.top = top + "px";

    const dragCenter = top + originalRects[draggedIndex].height / 2 - originalRects[0].top;
    let targetIndex = Math.round(dragCenter / slotHeight);
    targetIndex = Math.max(0, Math.min(targetIndex, otherIdsInOrder.length));
    if(targetIndex !== currentTargetIndex){
      currentTargetIndex = targetIndex;
      applyOtherRowTransforms(targetIndex);
    }
  }

  function onUp(){
    card.removeEventListener("pointermove", onMove);
    card.removeEventListener("pointerup", onUp);
    card.removeEventListener("pointercancel", onUp);

    const newOrderIds = otherIdsInOrder.slice(0, currentTargetIndex)
      .concat([draggedId])
      .concat(otherIdsInOrder.slice(currentTargetIndex));

    const itemsById = {};
    state.taikin.items[listId].forEach(i => { itemsById[i.id] = i; });
    state.taikin.items[listId] = newOrderIds.map(id => itemsById[id]);

    saveTaikinData();
    document.body.classList.remove("dragging-active");
    if(updateProgress) updateProgress();
    if(draw) draw();
  }

  card.addEventListener("pointermove", onMove);
  card.addEventListener("pointerup", onUp);
  card.addEventListener("pointercancel", onUp);
}

function renderTkHistory(){
  const log = state.taikin.dayLog;
  const completed = state.taikin.completedHistory;
  if(log.length === 0 && completed.length === 0){
    mainEl.innerHTML = `
      <div class="empty-hint">
        ${pandaImg("panda13")}
        まだ記録はないよ。<br>「まとめてリセット」を押すか、日付が変わると残るよ♪
      </div>
    `;
    return;
  }
  const logHtml = log.length ? `
    <div class="history-section-label">直近${log.length}日分の記録（最大${MAX_DAYLOG}日分）</div>
    <div id="tkHistList"></div>
  ` : "";
  const completedHtml = completed.length ? `
    <div class="history-section-label" style="margin-top:${log.length?'20px':'0'};">完了したタスク</div>
    <div id="tkCompletedList"></div>
  ` : "";
  mainEl.innerHTML = logHtml + completedHtml;

  if(log.length){
    document.getElementById("tkHistList").innerHTML = log.map((e,i) => {
      const totalDone = e.lists.reduce((s,l)=>s+l.done,0);
      const totalAll = e.lists.reduce((s,l)=>s+l.total,0);
      return `
        <div class="tk-history-item tk-history-toggle" data-idx="${i}">
          <div class="tk-hdate">${escapeHtml(e.date)}</div>
          <div class="tk-hsub">${totalDone}/${totalAll} 完了　${ICONS.arrow}</div>
          <div class="tk-hdetail" style="display:none;"></div>
        </div>
      `;
    }).join("");
    document.querySelectorAll(".tk-history-toggle").forEach(el => {
      el.addEventListener("click", () => {
        const detail = el.querySelector(".tk-hdetail");
        const isOpen = detail.style.display !== "none";
        if(isOpen){ detail.style.display = "none"; return; }
        const idx = parseInt(el.dataset.idx, 10);
        const e = log[idx];
        detail.innerHTML = e.lists.map(l => `
          <div style="margin-top:8px;">
            <div style="font-weight:700; font-family:'Zen Maru Gothic', sans-serif;">${escapeHtml(l.name)}（${l.done}/${l.total}）</div>
            <div style="color:var(--muted); font-size:12.5px; line-height:1.6;">${l.items.map(it=>escapeHtml(it.text)+(it.checked?'✓':'')).join('、')}</div>
          </div>
        `).join("");
        detail.style.display = "block";
      });
    });
  }
  if(completed.length){
    document.getElementById("tkCompletedList").innerHTML = completed.map(h => `
      <div class="tk-history-item">
        <div class="tk-hdate">${escapeHtml(h.text)}</div>
        <div class="tk-hsub">${escapeHtml(h.listName)}・${escapeHtml(h.date)}</div>
      </div>
    `).join("");
  }
}

function openTkReorderModal(){

function renderTkReorderModal(){
  const rows = state.taikin.lists.map((l, i) => `
    <div class="reorder-row">
      <span class="dot" style="background:${l.color}"></span>
      <span class="name">${escapeHtml(l.name)}</span>
      <span class="reorder-btns">
        <button data-dir="up" data-idx="${i}" ${i===0?'disabled':''}>${ICONS.up}</button>
        <button data-dir="down" data-idx="${i}" ${i===state.taikin.lists.length-1?'disabled':''}>${ICONS.down}</button>
      </span>
    </div>
  `).join("");
  modalSheet.innerHTML = `
    <h2>↕️ 並び替え</h2>
    <div class="reorder-hint">ホーム画面でのリストの順番を変えられます。</div>
    <div class="reorder-list">${rows}</div>
    <div class="modal-actions"><button class="btn" id="tkReorderCloseBtn">閉じる</button></div>
  `;
  modalSheet.querySelectorAll(".reorder-btns button").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const dir = btn.dataset.dir;
      const target = dir === "up" ? idx - 1 : idx + 1;
      if(target < 0 || target >= state.taikin.lists.length) return;
      const arr = state.taikin.lists;
      [arr[idx], arr[target]] = [arr[target], arr[idx]];
      saveTaikinData();
      renderTkReorderModal();
    });
  });
  document.getElementById("tkReorderCloseBtn").onclick = () => { closeModal(); if(state.view==="home") render(); };
}

const discountModes = ["percent","yen","backPrice","backPercent"];
const discountModeLabels = {

  yen:"○円引きでいくら？",

function renderDiscountFields(){
  const fields = document.getElementById("dc_fields");
  if(discountMode === "percent"){
    fields.innerHTML = `
      <div class="calc-field"><label>元の値段</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_price" placeholder="0"><span class="unit">円</span></div></div>

    `;
  }else if(discountMode === "yen"){
    fields.innerHTML = `
      <div class="calc-field"><label>元の値段</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_price" placeholder="0"><span class="unit">円</span></div></div>
      <div class="calc-field"><label>値引き額</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_off" placeholder="0"><span class="unit">円引き</span></div></div>
    `;
  }else if(discountMode === "backPrice"){
    fields.innerHTML = `
      <div class="calc-field"><label>割引後の値段</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_after" placeholder="0"><span class="unit">円</span></div></div>
      <div class="calc-field"><label>割引率</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_rate" placeholder="0"><span class="unit">％OFF</span></div></div>
    `;
  }else if(discountMode === "backPercent"){
    fields.innerHTML = `
      <div class="calc-field"><label>元の値段</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_price" placeholder="0"><span class="unit">円</span></div></div>
      <div class="calc-field"><label>割引後の値段</label>
        <div class="field-row"><input type="number" inputmode="decimal" id="dc_after" placeholder="0"><span class="unit">円</span></div></div>
    `;
  }
}

function calcDiscount(){
  const resEl = document.getElementById("dc_result");
  if(discountMode === "percent"){
    const price = getNum("dc_price"), rate = getNum("dc_rate");
    if(!(price > 0) || !(rate >= 0)){ resEl.innerHTML = errorBox("元の値段と割引率を入力してね。"); return; }
    const after = price * (1 - rate/100);
    resEl.innerHTML = resultShell(`
      <div class="result-label">割引後の値段</div>
      <div class="result-number">${fmt(after)}<span class="small">円</span></div>
      <div class="result-sub">${price}円の${rate}％OFFは${fmt(after)}円だよ</div>
    `);
    pushHistory("discount", `${fmt(after)}円`, `${price}円の${rate}％OFF → ${fmt(after)}円`);
  }else if(discountMode === "yen"){
    const price = getNum("dc_price"), off = getNum("dc_off");
    if(!(price > 0) || !(off >= 0)){ resEl.innerHTML = errorBox("元の値段と値引き額を入力してね。"); return; }
    const after = price - off;
    resEl.innerHTML = resultShell(`
      <div class="result-label">割引後の値段</div>
      <div class="result-number">${fmt(after)}<span class="small">円</span></div>
      <div class="result-sub">${price}円から${off}円引きで${fmt(after)}円だよ</div>
    `);
    pushHistory("discount", `${fmt(after)}円`, `${price}円から${off}円引き → ${fmt(after)}円`);
  }else if(discountMode === "backPrice"){
    const after = getNum("dc_after"), rate = getNum("dc_rate");
    if(!(after > 0) || !(rate > 0) || rate >= 100){ resEl.innerHTML = errorBox("割引後の値段と、0〜100未満の割引率を入力してね。"); return; }
    const price = after / (1 - rate/100);
    resEl.innerHTML = resultShell(`
      <div class="result-label">元の値段</div>
      <div class="result-number">${fmt(price)}<span class="small">円</span></div>
      <div class="result-sub">${rate}％OFFで${after}円なら、元は${fmt(price)}円だよ</div>
    `);
    pushHistory("discount", `元値${fmt(price)}円`, `${rate}％OFFで${after}円 → 元値${fmt(price)}円`);
  }else if(discountMode === "backPercent"){
    const price = getNum("dc_price"), after = getNum("dc_after");
    if(!(price > 0) || !(after >= 0) || after > price){ resEl.innerHTML = errorBox("元の値段と割引後の値段を、正しい大小関係で入力してね。"); return; }
    const rate = (1 - after/price) * 100;
    resEl.innerHTML = resultShell(`
      <div class="result-label">割引率</div>
      <div class="result-number">${fmt(rate)}<span class="small">％OFF</span></div>
      <div class="result-sub">${price}円 → ${after}円は、約${fmt(rate)}％OFFだよ</div>
    `);
    pushHistory("discount", `${fmt(rate)}％OFF`, `${price}円→${after}円 → 約${fmt(rate)}％OFF`);
  }
}

/* ---- ③ どっちがお得？ ---- */
const compareUnits = ["g","ml","個","枚","本","m"];
const fullWidthLetter = { A:"Ａ", B:"Ｂ" };
function compareProductFields(letter){
  return `
    <div class="section-label">【 商品${fullWidthLetter[letter]} 】</div>
    <div class="calc-field"><label>価格</label>
      <div class="field-row"><input type="number" inputmode="decimal" id="cp_price_${letter}" placeholder="0"><span class="unit">円</span></div></div>
    <div class="calc-field"><label>内容量</label>
      <div class="field-row">
        <input type="number" inputmode="decimal" id="cp_qty_${letter}" placeholder="0">
        <select class="unit-select" id="cp_unit_${letter}">${compareUnits.map(u=>`<option value="${u}">${u}</option>`).join("")}</select>
      </div>
    </div>
    <div class="calc-field"><label>入り数（1つの中にいくつ入っているか・省略時は1）</label>
      <div class="field-row"><input type="number" inputmode="decimal" id="cp_pack_${letter}" placeholder="1"><span class="unit">個</span></div></div>
    <div class="calc-field"><label>セット数（省略時は1）</label>
      <div class="field-row"><input type="number" inputmode="decimal" id="cp_set_${letter}" placeholder="1"><span class="unit">セット</span></div></div>
  `;
}
function renderCompare(){
  mainEl.innerHTML = `
    ${compareProductFields("A")}
    ${compareProductFields("B")}
    <button class="calc-btn" id="cp_calc">比較する</button>
    <div id="cp_result"></div>
  `;
  document.getElementById("cp_calc").onclick = calcCompare;
}
function compareUnitPrice(letter){
  const price = getNum(`cp_price_${letter}`);
  const qty = getNum(`cp_qty_${letter}`);
  const packEl = document.getElementById(`cp_pack_${letter}`);
  const setEl = document.getElementById(`cp_set_${letter}`);
  const pack = packEl.value === "" ? 1 : parseFloat(packEl.value);
  const set = setEl.value === "" ? 1 : parseFloat(setEl.value);
  const unit = document.getElementById(`cp_unit_${letter}`).value;
  if(!(price > 0) || !(qty > 0) || !(pack > 0) || !(set > 0)) return null;
  const totalQty = qty * pack * set;
  const unitPrice = price / totalQty;
  return { price, qty, pack, set, unit, totalQty, unitPrice };
}
function calcCompare(){
  const resEl = document.getElementById("cp_result");
  const a = compareUnitPrice("A");
  const b = compareUnitPrice("B");
  if(!a || !b){
    resEl.innerHTML = errorBox("商品A・Bどちらも、価格と内容量を0より大きい数字で入力してね。");
    return;
  }
  if(a.unit !== b.unit){
    resEl.innerHTML = errorBox("商品AとBの単位（g/ml/個など）をそろえてね。");
    return;
  }
  const winner = a.unitPrice < b.unitPrice ? "A" : (b.unitPrice < a.unitPrice ? "B" : null);
  const diffPct = winner ? Math.abs(1 - (winner==="A"? a.unitPrice/b.unitPrice : b.unitPrice/a.unitPrice)) * 100 : 0;
  resEl.innerHTML = resultShell(`
    <div class="result-winner">${winner ? `商品${fullWidthLetter[winner]}のほうがお得！` : "ＡとＢは同じ単価だよ"}</div>
    <div class="compare-lines">
      <div class="${winner==='A'?'win':''}">Ａ：1${a.unit}あたり ${fmt(a.unitPrice)}円</div>
      <div class="${winner==='B'?'win':''}">Ｂ：1${b.unit}あたり ${fmt(b.unitPrice)}円</div>
    </div>
    ${winner ? `<div class="result-sub">商品${fullWidthLetter[winner]}のほうが約${fmt(diffPct)}%お得だよ</div>` : ``}
  `);
  pushHistory("compare",
    winner ? `${fullWidthLetter[winner]}がお得` : "同額",
    `Ａ:1${a.unit}${fmt(a.unitPrice)}円 / Ｂ:1${b.unit}${fmt(b.unitPrice)}円`
  );
}

/* ---- 並び替え ---- */
function openReorderModal(){
  renderReorderModal();
  modalBackdrop.classList.remove("hidden");
}
let openColorPaletteId = null;
function renderReorderModal(){
  const rows = state.order.map((id, i) => {
    const f = featureById(id);
    const isOpen = openColorPaletteId === id;
    const usedColors = state.order
      .filter(otherId => otherId !== id)
      .map(otherId => featureColor(featureById(otherId)));
    const swatches = COLOR_PALETTE.map(c => {
      const isSelected = featureColor(f) === c;
      const isUsed = !isSelected && usedColors.includes(c);
      return `
      <span class="color-swatch ${isSelected ? 'selected':''} ${isUsed ? 'used':''}" data-id="${id}" data-color="${c}" data-used="${isUsed}" style="background:${c}"></span>
    `;
    }).join("");
    return `
      <div class="reorder-row">
        <span class="dot" data-id="${id}" style="background:${featureColor(f)}"></span>
        <span class="name">${escapeHtml(f.name)}</span>
        <span class="reorder-btns">
          <button data-dir="up" data-idx="${i}" ${i===0?'disabled':''}>${ICONS.up}</button>
          <button data-dir="down" data-idx="${i}" ${i===state.order.length-1?'disabled':''}>${ICONS.down}</button>
        </span>
      </div>
      <div class="color-palette ${isOpen?'open':''}">${swatches}</div>
    `;
  }).join("");
  modalSheet.innerHTML = `
    <h2>↕️ 並び替え</h2>
    <div class="reorder-hint">よく使うものが上に来るように、ホーム画面の順番を変えられます。ドットをタップすると色も変えられるよ。</div>
    <div class="reorder-list">${rows}</div>
    <div class="modal-actions"><button class="btn" id="reorderCloseBtn">閉じる</button></div>
  `;
  modalSheet.querySelectorAll(".reorder-btns button").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const dir = btn.dataset.dir;
      const target = dir === "up" ? idx - 1 : idx + 1;
      if(target < 0 || target >= state.order.length) return;
      const arr = state.order;
      [arr[idx], arr[target]] = [arr[target], arr[idx]];
      saveOrder(arr);
      renderReorderModal();
    });
  });
  modalSheet.querySelectorAll(".reorder-row .dot").forEach(dot => {
    dot.addEventListener("click", () => {
      const id = dot.dataset.id;
      openColorPaletteId = (openColorPaletteId === id) ? null : id;
      renderReorderModal();
    });
  });
  modalSheet.querySelectorAll(".color-swatch").forEach(sw => {
    sw.addEventListener("click", () => {
      if(sw.dataset.used === "true") return;
      const id = sw.dataset.id;
      state.colors[id] = sw.dataset.color;
      saveColors();
      renderReorderModal();
    });
  });
  document.getElementById("reorderCloseBtn").onclick = () => { closeModal(); if(state.view==="home") renderHome(); };
}

/* ====================== 表示データのリセット(キャッシュ削除) ====================== */
async function resetDisplayCache(){
  if(!confirm("表示をリセットします。リストの中身は消えません。よろしいですか?")){
    return;
  }
  try{
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map((key) => caches.delete(key)));
    }
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((reg) => reg.unregister()));
    }
  }catch(e){
    // 失敗しても、とりあえず読み込み直しは試みる
  }
  location.reload();
}

/* ====================== バックアップ・復元 ====================== */
function tkExportSnapshot(){
  return {
    order: state.order,
    history: state.history,
    colors: state.colors,
    taikin: state.taikin
  };
}
function doBackup(){
  try{
    const json = JSON.stringify(tkExportSnapshot(), null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const a = document.createElement("a");
    a.href = url;
    a.download = `tanka-panda-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert("バックアップの保存に失敗しました。");
  }
}
function triggerRestore(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.style.display = "none";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if(!file){ input.remove(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        alert("このファイルは読み込めませんでした。正しいバックアップファイルか確認してください。");
        input.remove();
        return;
      }
      if(!parsed || typeof parsed !== "object" || !parsed.taikin){
        alert("このファイルはバックアップ形式ではないようです。");
        input.remove();
        return;
      }
      if(!confirm("復元すると現在のデータは上書きされます。よろしいですか?")){
        input.remove();
        return;
      }
      state.order = Array.isArray(parsed.order) ? parsed.order : state.order;
      state.history = parsed.history || state.history;
      state.colors = parsed.colors || state.colors;
      state.taikin = parsed.taikin;
      saveOrder(state.order);
      saveHistory();
      saveColors();
      saveTaikinData();
      closeModal();
      state.view = "home";
      render();
      input.remove();
    };
    reader.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
}

function closeModal(){ modalBackdrop.classList.add("hidden"); }
modalBackdrop.addEventListener("click", e => { if(e.target === modalBackdrop) closeModal(); });

/* ====================== 初期化 ====================== */
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
